name: Build PHPNuxBill Admin APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Pilih tipe APK yang ingin di-build'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.build_variant }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ github.event.inputs.build_variant == 'release' && 'Release' || 'Debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Adaptive App Icons from logo.png
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/values

          LOGO_FILE=""
          for candidate in "logo.png" "1000060058.png" "play_store_512.png" "app/src/main/res/drawable-nodpi/arneta_logo_full.png"; do
            if [ -f "$candidate" ]; then
              LOGO_FILE="$candidate"
              break
            fi
          done

          if [ -n "$LOGO_FILE" ]; then
            if ! command -v convert &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi

            cp "$LOGO_FILE" /tmp/source_logo.png

            RAW_HEX=$(convert /tmp/source_logo.png -depth 8 -crop 1x1+4+4 txt:- | grep -oE '#[0-9A-Fa-f]{6}' | head -n 1)
            if [ -z "$RAW_HEX" ] || [ "$RAW_HEX" = "#FFFFFF" ] \vert{}\vert{} [ "$RAW_HEX" = "#ffffff" ]; then
              BG_HEX="#070B14"
            else
              BG_HEX="$RAW_HEX"
            fi

            convert /tmp/source_logo.png -resize 512x512 -background "$BG_HEX" -gravity center -extent 512x512 PNG32:app/src/main/res/drawable-nodpi/arneta_logo_full.png

            convert /tmp/source_logo.png -shave 2x2 -resize 68x68 -background "$BG_HEX" -gravity center -extent 108x108 PNG32:app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
            convert /tmp/source_logo.png -shave 2x2 -resize 102x102 -background "$BG_HEX" -gravity center -extent 162x162 PNG32:app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            convert /tmp/source_logo.png -shave 2x2 -resize 136x136 -background "$BG_HEX" -gravity center -extent 216x216 PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            convert /tmp/source_logo.png -shave 2x2 -resize 204x204 -background "$BG_HEX" -gravity center -extent 324x324 PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            convert /tmp/source_logo.png -shave 2x2 -resize 272x272 -background "$BG_HEX" -gravity center -extent 432x432 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

            for pair in "mdpi:48:42" "hdpi:72:64" "xhdpi:96:84" "xxhdpi:144:126" "xxxhdpi:192:168"; do
              IFS=":" read -r dpi full inner <<< "$pair"
              convert /tmp/source_logo.png -shave 2x2 -resize ${inner}x${inner} -background "$BG_HEX" -gravity center -extent ${full}x${full} PNG32:app/src/main/res/mipmap-${dpi}/ic_launcher.png
              cp app/src/main/res/mipmap-${dpi}/ic_launcher.png app/src/main/res/mipmap-${dpi}/ic_launcher_round.png
            done

            cat << EOF > app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">${BG_HEX}</color>
          </resources>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

            if [ -f "app/src/main/AndroidManifest.xml" ]; then
              sed -i 's|@drawable/ic_arneta_shield|@mipmap/ic_launcher|g' app/src/main/AndroidManifest.xml
              sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
              if ! grep -q "android:roundIcon=" app/src/main/AndroidManifest.xml; then
                sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
              fi
            fi
          fi

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Selected APK Variant (${{ github.event.inputs.build_variant }})
        run: |
          mkdir -p output-apk
          if [ "${{ github.event.inputs.build_variant }}" = "release" ]; then
            gradle assembleRelease --stacktrace
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              cp app/build/outputs/apk/release/app-release.apk output-apk/PHPNuxBill-Admin-Release.apk
            elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              cp app/build/outputs/apk/release/app-release-unsigned.apk output-apk/PHPNuxBill-Admin-Release-Unsigned.apk
            fi
          else
            gradle assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk output-apk/PHPNuxBill-Admin-Debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHPNuxBill-Admin-${{ github.event.inputs.build_variant }}-APK
          path: output-apk/*.apk
          retention-days: 14
