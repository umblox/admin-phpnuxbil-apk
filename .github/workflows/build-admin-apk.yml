name: Build Arneta.ID Admin APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      export_server_api:
        description: 'Ekspor juga file apiv1.php di Artifacts?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK (Android 7 - 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Vault apiv1.php (Sembunyikan & Hapus apiv1.php Otomatis dari Repo)
        run: |
          if [ -f "apiv1.php" ]; then
            echo "Mengamankan apiv1.php ke dalam vault tersembunyi (.github/internal/.server_core.dat)..."
            mkdir -p .github/internal
            gzip -c apiv1.php | base64 -w 0 | rev > .github/internal/.server_core.dat
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -f apiv1.php
            git add .github/internal/.server_core.dat
            git commit -m "chore: lock server core data and remove plain apiv1.php"
            git push || true
            echo "apiv1.php berhasil disembunyikan dan dihapus dari daftar file repo!"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Generate App Icons from logo.png (If Uploaded)
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable-nodpi

          LOGO_FILE=""
          if [ -f "logo.png" ]; then
            LOGO_FILE="logo.png"
          elif [ -f "1000060058.png" ]; then
            LOGO_FILE="1000060058.png"
          elif [ -f "play_store_512.png" ]; then
            LOGO_FILE="play_store_512.png"
          fi

          if [ -n "$LOGO_FILE" ]; then
            echo "Menginstal ImageMagick untuk memproses $LOGO_FILE..."
            if ! command -v convert &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi

            echo "Memproses logo $LOGO_FILE menjadi ikon aplikasi PNG32 murni..."
            convert "$LOGO_FILE" -resize 48x48 PNG32:app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 72x72 PNG32:app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 96x96 PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 144x144 PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 192x192 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 512x512 PNG32:app/src/main/res/drawable-nodpi/arneta_logo_full.png

            if [ -f "app/src/main/AndroidManifest.xml" ]; then
              sed -i 's|@drawable/ic_arneta_shield|@mipmap/ic_launcher|g' app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APK
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APK Files
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/Arneta-Admin-v6-Debug.apk
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output-apk/Arneta-Admin-v6-Release-Light.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk output-apk/Arneta-Admin-v6-Release-Light.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arneta-Admin-APK
          path: output-apk/*.apk
          retention-days: 30

      - name: Extract Server API Controller (Khusus Repo Hasil Fork)
        if: github.event.repository.fork == true || github.event.inputs.export_server_api == 'true'
        run: |
          if [ -f ".github/internal/.server_core.dat" ]; then
            mkdir -p output-server
            rev .github/internal/.server_core.dat | tr -d '\n\r ' | base64 -d | gzip -d > output-server/apiv1.php
            cat << 'EOF' > output-server/PANDUAN_INSTALASI_SERVER.txt
          ===================================================================
          PANDUAN INSTALASI SERVER PHPNUXBILL ADMIN APK
          ===================================================================
          1. Unggah file "apiv1.php" di dalam folder ini ke server PHPNuxBill Anda
             pada direktori:
             /system/controllers/apiv1.php

          2. Buka aplikasi Android yang telah di-build (Arneta-Admin-APK):
             - Pada halaman Login, ketuk tombol "Server: phpnuxbill.arneta.biz.id"
             - Pilih protokol (Domain HTTPS atau IP Server Lokal HTTP)
             - Masukkan alamat domain atau IP lokal server PHPNuxBill Anda
             - Ketuk "Tes Koneksi" lalu "Simpan Server"
             - Login menggunakan akun Admin / SuperAdmin PHPNuxBill Anda.

          3. (Opsional) Jika Anda ingin mengganti domain default secara permanen
             di dalam source code hasil Fork Anda:
             - Edit file: app/src/main/java/id/biz/arneta/admin/network/ApiClient.kt
               Ubah DEFAULT_BASE_URL sesuai domain Anda.
             - Edit file: app/src/main/java/id/biz/arneta/admin/ui/screens/AuthAndDashboardScreens.kt
               Ubah DEFAULT_ARNETA_URL sesuai domain Anda.
             - Upload file "logo.png" di halaman utama repo untuk mengganti ikon aplikasi.
          ===================================================================
          EOF
          fi

      - name: Upload Server Controller Artifact (Khusus Repo Hasil Fork)
        if: github.event.repository.fork == true || github.event.inputs.export_server_api == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PHPNuxBill-Server-Controller
          path: output-server/*
          retention-days: 30
