name: Build PHPNuxBill Admin APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Pilih varian APK yang ingin di-build'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      gradle_version:
        description: 'Versi Gradle Builder'
        required: true
        default: '9.6.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.build_variant }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile Android APK (${{ github.event.inputs.build_variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Generate Full Blue App Icons (Hapus Border Putih Otomatis)
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/values

          LOGO_FILE=""
          for candidate in "logo.png" "1000347237.png" "1000060058.png" "play_store_512.png" "app/src/main/res/drawable-nodpi/arneta_logo_full.png"; do
            if [ -f "$candidate" ]; then
              LOGO_FILE="$candidate"
              break
            fi
          done

          if [ -n "$LOGO_FILE" ]; then
            if ! command -v convert &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi

            # 1. Standarisasi ukuran gambar sumber ke 512x512 terlebih dahulu
            convert "$LOGO_FILE" -resize 512x512\! PNG32:/tmp/source_512.png

            # 2. Ambil sampel warna biru dari area dalam (+80+80) agar tidak mengenai border putih luar
            RAW_HEX=$(convert /tmp/source_512.png -depth 8 -crop 1x1+80+80 txt:- | grep -oE '#[0-9A-Fa-f]{6}' | head -n 1)
            if [ -z "$RAW_HEX" ] || [ "$RAW_HEX" = "#FFFFFF" ] || [ "$RAW_HEX" = "#ffffff" ]; then
              BG_HEX="#0568FD"
            else
              BG_HEX="$RAW_HEX"
            fi
            echo "Menggunakan warna biru utama ikon: $BG_HEX"

            # 3. Potong bersih seluruh border putih & sudut lengkung luar (-shave 58x58) lalu jadikan Full-Bleed 512x512
            convert /tmp/source_512.png -shave 58x58 -resize 512x512\! PNG32:/tmp/clean_full_blue.png

            # Simpan untuk logo di dalam aplikasi (Login & Top Header)
            cp /tmp/clean_full_blue.png app/src/main/res/drawable-nodpi/arneta_logo_full.png

            # 4. Generate Layer Foreground Adaptive Icon (Full biru menyatu dengan background tanpa garis tepi)
            convert /tmp/clean_full_blue.png -resize 72x72 -background "$BG_HEX" -gravity center -extent 108x108 PNG32:app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
            convert /tmp/clean_full_blue.png -resize 108x108 -background "$BG_HEX" -gravity center -extent 162x162 PNG32:app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            convert /tmp/clean_full_blue.png -resize 144x144 -background "$BG_HEX" -gravity center -extent 216x216 PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            convert /tmp/clean_full_blue.png -resize 216x216 -background "$BG_HEX" -gravity center -extent 324x324 PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            convert /tmp/clean_full_blue.png -resize 288x288 -background "$BG_HEX" -gravity center -extent 432x432 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

            # 5. Generate Legacy Icon & Round Icon (Full biru dari ujung ke ujung)
            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              IFS=":" read -r dpi full <<< "$pair"
              convert /tmp/clean_full_blue.png -resize ${full}x${full}\! PNG32:app/src/main/res/mipmap-${dpi}/ic_launcher.png
              cp app/src/main/res/mipmap-${dpi}/ic_launcher.png app/src/main/res/mipmap-${dpi}/ic_launcher_round.png
            done

            # 6. Buat file warna background biru & XML Adaptive Icon
            cat << EOF > app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">${BG_HEX}</color>
          </resources>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

            if [ -f "app/src/main/AndroidManifest.xml" ]; then
              sed -i 's|@drawable/ic_arneta_shield|@mipmap/ic_launcher|g' app/src/main/AndroidManifest.xml
              sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
              if ! grep -q "android:roundIcon=" app/src/main/AndroidManifest.xml; then
                sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
              fi
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ github.event.inputs.gradle_version || '9.4.0' }}

      - name: Build Selected APK Variant
        run: |
          mkdir -p output-apk
          if [ "${{ github.event.inputs.build_variant }}" = "release" ]; then
            gradle assembleRelease --stacktrace
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              cp app/build/outputs/apk/release/app-release.apk output-apk/Arneta-Admin-v6-Release-Light.apk
            elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              cp app/build/outputs/apk/release/app-release-unsigned.apk output-apk/Arneta-Admin-v6-Release-Light.apk
            fi
          else
            gradle assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk output-apk/Arneta-Admin-v6-Debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arneta-Admin-${{ github.event.inputs.build_variant }}-APK
          path: output-apk/*.apk
          retention-days: 14
