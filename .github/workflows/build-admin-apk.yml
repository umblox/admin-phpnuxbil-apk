name: Build Arneta.ID Admin APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK (Android 7 - 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Generate App Icons from logo.png (If Uploaded)
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable-nodpi

          LOGO_FILE=""
          if [ -f "logo.png" ]; then
            LOGO_FILE="logo.png"
          elif [ -f "1000060058.png" ]; then
            LOGO_FILE="1000060058.png"
          elif [ -f "play_store_512.png" ]; then
            LOGO_FILE="play_store_512.png"
          fi

          if [ -n "$LOGO_FILE" ]; then
            echo "Menginstal ImageMagick untuk memproses $LOGO_FILE..."
            if ! command -v convert &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi

            echo "Memproses logo $LOGO_FILE menjadi ikon aplikasi PNG32 murni..."
            convert "$LOGO_FILE" -resize 48x48 PNG32:app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 72x72 PNG32:app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 96x96 PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 144x144 PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 192x192 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 512x512 PNG32:app/src/main/res/drawable-nodpi/arneta_logo_full.png

            # Gunakan ikon mipmap hasil konversi logo.png di AndroidManifest.xml
            if [ -f "app/src/main/AndroidManifest.xml" ]; then
              sed -i 's|@drawable/ic_arneta_shield|@mipmap/ic_launcher|g' app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APK
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APK Files
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/Arneta-Admin-v6-Debug.apk
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output-apk/Arneta-Admin-v6-Release-Light.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk output-apk/Arneta-Admin-v6-Release-Light.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arneta-Admin-APK
          path: output-apk/*.apk
          retention-days: 30
